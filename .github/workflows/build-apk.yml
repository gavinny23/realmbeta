name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Create .env
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EOF

      - name: Clean project
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build

      - name: Get dependencies
        run: flutter pub get

      - name: Patch on_audio_query_android namespace & JVM target
        shell: bash
        run: |
          echo "PUB_CACHE=${PUB_CACHE:-unset}"
          FILE=$(find ~/.pub-cache -path "*on_audio_query_android-*/android/build.gradle" 2>/dev/null | head -n1)
          if [ -z "$FILE" ] && [ -n "$PUB_CACHE" ]; then
            FILE=$(find "$PUB_CACHE" -path "*on_audio_query_android-*/android/build.gradle" 2>/dev/null | head -n1)
          fi
          if [ -n "$FILE" ]; then
            echo "Found: $FILE"
            if ! grep -q "namespace" "$FILE"; then
              sed -i "s/android {/android {\n    namespace 'com.lucasjosino.on_audio_query'/" "$FILE"
            fi
            # Append a second android{} block. Gradle just re-invokes the
            # closure against the same extension, and since this is
            # textually last in the file, these values win regardless of
            # whatever syntax (with or without '=') the original block used.
            cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF
            echo "---- Patched file ----"
            cat "$FILE"
            echo "-----------------------"
          else
            echo "::warning::on_audio_query_android build.gradle not found under ~/.pub-cache or \$PUB_CACHE — patch not applied."
            find ~/.pub-cache -maxdepth 4 -iname "*on_audio_query*" 2>/dev/null || true
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Realm-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
