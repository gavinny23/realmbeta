name: reality_merge
description: "Reality Merge v3 — AR drops, location-unlocked social."
publish_to: 'none'
version: 0.3.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  geolocator: ^12.0.0
  geolocator_android: ^4.6.1
  geolocator_apple: ^2.3.7
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  photo_manager: ^3.6.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0
  http: ^1.2.0
  file_picker: ^10.3.9
  shared_preferences: ^2.3.2
  video_player: ^2.9.1
  vector_math: ^2.1.4
  permission_handler: ^11.3.1
  sensors_plus: ^5.0.1
  url_launcher: ^6.3.1
  image: ^4.2.0
  video_compress: ^3.1.3
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2
  xml: ^6.5.0
  on_audio_query: ^2.9.0
  just_audio: ^0.9.40
  path_provider: ^2.1.4
  google_mobile_ads: ^7.0.0
  reply_bridge:
    path: packages/reply_bridge

# path_provider_android 2.3.0+ rewrote its Android implementation on
# top of the `jni`/`jni_flutter` packages, which load libdartjni.so
# and initialize JNI as soon as the Flutter engine attaches — before
# Dart's main() runs. That's a suspected source of a native
# startup crash that Dart-side try/catch can't intercept. Pinning
# path_provider_android back to its last pre-JNI (pure Kotlin/Java)
# release removes jni and jni_flutter from the dependency tree
# entirely. Revisit this override once the JNI-based releases have
# more real-world mileage, or if this pin turns out not to be the
# fix — this is our leading theory, not a confirmed root cause yet.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/realm_logo.png
    - assets/branding/realm_icon_mark.png
    - assets/backgrounds/chat_doodle.png

# Launcher icons were generated directly (mipmap-mdpi through -xxxhdpi)
# from assets/branding/realm_icon_mark.png, since it's just the pin
# mark cropped square — the wordmark in realm_logo.png would be
# illegible at launcher-icon sizes. This config is kept so the icons
# can be regenerated the same way later (`dart run flutter_launcher_icons`)
# if the mark changes.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/realm_icon_mark.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/branding/realm_icon_mark.png"
  min_sdk_android: 21
